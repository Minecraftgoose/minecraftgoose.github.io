name: Sync projects

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
      GH_USER: ${{ github.repository_owner }}
      FEATURED_REPOS: ${{ vars.FEATURED_REPOS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Fetch projects
        run: node scripts/fetch-projects.mjs

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync projects"
            git push
          fi